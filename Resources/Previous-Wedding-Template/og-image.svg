<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF5F0"/>
      <stop offset="100%" stop-color="#F5EDE8"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5E4E4"/>
      <stop offset="30%" stop-color="#C48A8A"/>
      <stop offset="50%" stop-color="#C4A882"/>
      <stop offset="70%" stop-color="#C8D9C4"/>
      <stop offset="100%" stop-color="#F5E4E4"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Top stripe -->
  <rect width="1200" height="5" fill="url(#stripe)"/>
  <!-- Bottom stripe -->
  <rect y="625" width="1200" height="5" fill="url(#stripe)"/>
  <!-- Inner border -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="rgba(196,138,138,0.2)" stroke-width="1.5" rx="0"/>
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="rgba(196,138,138,0.08)" stroke-width="1" rx="0"/>
  <!-- Decorative diamond -->
  <g transform="translate(600,110) rotate(45)">
    <rect x="-5" y="-5" width="10" height="10" fill="#C48A8A"/>
  </g>
  <!-- Ornament lines -->
  <line x1="500" y1="110" x2="586" y2="110" stroke="#E2D0B4" stroke-width="1"/>
  <line x1="614" y1="110" x2="700" y2="110" stroke="#E2D0B4" stroke-width="1"/>
  <!-- Names -->
  <text x="600" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-style="italic" fill="#A06464" letter-spacing="2">Natalia</text>
  <text x="600" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic" fill="#C4A882">&amp; András</text>
  <!-- Divider -->
  <line x1="440" y1="310" x2="576" y2="310" stroke="#E2D0B4" stroke-width="1"/>
  <g transform="translate(600,310) rotate(45)">
    <rect x="-4" y="-4" width="8" height="8" fill="#C48A8A"/>
  </g>
  <line x1="624" y1="310" x2="760" y2="310" stroke="#E2D0B4" stroke-width="1"/>
  <!-- Date -->
  <text x="600" y="380" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-style="italic" fill="#A06464">July 18, 2026</text>
  <!-- Location -->
  <text x="600" y="430" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="200" font-size="16" fill="#9C8878" letter-spacing="5">BUDAPEST · ROMANI PART 43</text>
  <!-- Bottom divider -->
  <line x1="460" y1="470" x2="576" y2="470" stroke="#E2D0B4" stroke-width="1"/>
  <g transform="translate(600,470) rotate(45)">
    <rect x="-4" y="-4" width="8" height="8" fill="#C48A8A"/>
  </g>
  <line x1="624" y1="470" x2="740" y2="470" stroke="#E2D0B4" stroke-width="1"/>
  <!-- Tagline -->
  <text x="600" y="520" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#5C4840">You're invited to celebrate with us</text>
  <!-- Wedding rings -->
  <circle cx="578" cy="150" r="18" fill="none" stroke="#C4A882" stroke-width="2"/>
  <circle cx="622" cy="150" r="18" fill="none" stroke="#C4A882" stroke-width="2"/>
</svg>