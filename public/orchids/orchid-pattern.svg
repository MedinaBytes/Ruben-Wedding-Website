<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none" aria-hidden="true">
  <!-- Repeatable tone-on-tone botanical motif for blind-emboss / letterpress paper texture -->
