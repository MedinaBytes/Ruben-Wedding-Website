    <!-- Center Orchid Motif -->
    <path d="M80 62 C74 54 72 40 80 32 C88 40 86 54 80 62 Z" />
    <path d="M78 64 C64 54 48 58 48 70 C48 82 64 84 76 74" />
    <path d="M82 64 C96 54 112 58 112 70 C112 82 96 84 84 74" />
    <path d="M75 72 C66 78 62 90 68 98 C74 104 82 98 80 86" />
    <path d="M85 72 C94 78 98 90 92 98 C86 104 78 98 80 86" />
    <circle cx="80" cy="74" r="2.5" fill="#9E8D86" fill-opacity="0.12" />

    <!-- Corner Motifs (wrap seamlessly at 0, 160) -->
    <!-- Top-Left / Bottom-Right / etc. -->
    <path d="M0 18 C8 24 16 22 22 14" />
    <path d="M18 0 C24 8 22 16 14 22" />
    
    <path d="M160 18 C152 24 144 22 138 14" />
    <path d="M142 0 C136 8 138 16 146 22" />

    <path d="M0 142 C8 136 16 138 22 146" />
    <path d="M18 160 C24 152 22 144 14 138" />

    <path d="M160 142 C152 136 144 138 138 146" />
    <path d="M142 160 C136 152 138 144 146 138" />

    <!-- Subtle leaf accent hairlines -->
    <path d="M30 110 Q45 125 60 115" stroke-dasharray="1 3" />
    <path d="M130 50 Q115 35 100 45" stroke-dasharray="1 3" />
  </g>
</svg>
