<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" width="100%" height="100%" fill="none" aria-hidden="true">
  <defs>
    <!-- Petal Watercolor Gradients -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73826B" />
      <stop offset="60%" stop-color="#55644E" />
      <stop offset="100%" stop-color="#414D3C" />
    </linearGradient>

    <radialGradient id="petalBlush" cx="45%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FCF5F5" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#F7E2E4" stop-opacity="0.88" />
      <stop offset="85%" stop-color="#EBBBC0" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#D9979F" stop-opacity="0.9" />
    </radialGradient>

    <radialGradient id="petalBlushDorsal" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#FBF0F1" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#E8B4BA" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#CF8790" stop-opacity="0.9" />
    </radialGradient>

    <linearGradient id="lipGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B84A59" />
      <stop offset="50%" stop-color="#8F2D3B" />
      <stop offset="100%" stop-color="#6B1A25" />
    </linearGradient>

    <radialGradient id="lipCallus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5E4B2" />
      <stop offset="45%" stop-color="#E2B765" />
      <stop offset="100%" stop-color="#B67B28" />
    </radialGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#8A9A80" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#65765D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#475440" stop-opacity="0.95" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Foliage / Leaves -->
  <g id="leaves" opacity="0.9">
    <path d="M120 860 C150 820 220 810 320 840 C280 870 200 890 120 860 Z" fill="url(#leafGrad)" />
    <path d="M120 860 C180 835 240 845 305 850" stroke="#9AB08F" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />
    <path d="M100 880 C60 810 50 750 90 700 C105 745 100 820 100 880 Z" fill="url(#leafGrad)" />
    <path d="M100 880 C85 810 80 760 90 710" stroke="#9AB08F" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />
  </g>

  <!-- Main Arching Stem -->
  <g id="stem">
    <path d="M110 860 Q130 680 160 520 T210 320 T280 150 Q310 90 350 45" stroke="url(#stemGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M112 860 Q132 680 162 520 T212 320 T282 150 Q311 90 351 45" stroke="#A8BCA0" stroke-width="1" stroke-linecap="round" opacity="0.4" fill="none" />
    
    <!-- Secondary lateral pedicels connecting flowers -->
    <path d="M165 500 Q180 485 210 490" stroke="url(#stemGrad)" stroke-width="2.8" stroke-linecap="round" fill="none" />
    <path d="M215 315 Q235 295 260 305" stroke="url(#stemGrad)" stroke-width="2.6" stroke-linecap="round" fill="none" />
    <path d="M285 145 Q305 130 330 140" stroke="url(#stemGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Buds at the tip of the cascade -->
  <g id="buds">
    <!-- Tiny terminal bud -->
    <g transform="translate(352, 43) rotate(-25)">
      <path d="M0 0 C4 -6 12 -4 14 2 C15 8 8 12 0 8 Z" fill="#9FB395" />
      <path d="M0 0 C6 -2 10 2 12 4" stroke="#D18E97" stroke-width="0.8" opacity="0.7" />
    </g>
    <!-- Swelling bud 1 -->
    <g transform="translate(335, 78) rotate(-15)">
      <path d="M0 0 C8 -10 20 -8 24 2 C26 12 14 18 0 12 Z" fill="#B3C4AB" />
      <path d="M2 1 C10 -4 18 0 20 6" stroke="#D49AA1" stroke-width="1.2" opacity="0.8" />
      <circle cx="16" cy="5" r="2.5" fill="#E8B4BA" opacity="0.8" />
    </g>
    <!-- Emerging half-open bud 2 -->
    <g transform="translate(315, 115) rotate(-5)">
      <path d="M-5 5 C5 -16 26 -14 32 0 C36 14 18 24 -2 16 Z" fill="url(#petalBlush)" />
      <path d="M0 3 C12 -6 24 2 28 8" stroke="#CF8790" stroke-width="1.2" opacity="0.7" />
      <path d="M-2 16 C6 18 16 14 20 8" stroke="#9BB092" stroke-width="1.5" fill="none" />
    </g>
  </g>

  <!-- Cascade Bloom 1 (Top / Mid-Small) -->
  <g id="bloom-top" transform="translate(310, 190) scale(0.72)">
    <!-- Sepals -->
    <path d="M0 -75 C-25 -65 -35 -25 -20 0 C-5 15 15 15 22 0 C35 -25 25 -65 0 -75 Z" fill="url(#petalBlushDorsal)" opacity="0.9" />
    <path d="M-15 0 C-65 15 -80 50 -60 75 C-40 85 -10 65 0 20 Z" fill="url(#petalBlush)" opacity="0.88" />
    <path d="M15 0 C65 15 80 50 60 75 C40 85 10 65 0 20 Z" fill="url(#petalBlush)" opacity="0.88" />
    <!-- Lateral broad petals -->
    <path d="M-10 -15 C-70 -45 -115 -10 -95 35 C-75 75 -25 45 -5 10 Z" fill="url(#petalBlush)" />
    <path d="M10 -15 C70 -45 115 -10 95 35 C75 75 25 45 5 10 Z" fill="url(#petalBlush)" />
    <!-- Center Lip & Throat -->
    <path d="M-20 20 C-25 45 -15 65 0 70 C15 65 25 45 20 20 Z" fill="url(#lipGradient)" />
    <path d="M-12 25 C-15 35 0 42 0 42 C0 42 15 35 12 25 Z" fill="url(#lipCallus)" />
    <circle cx="0" cy="18" r="4.5" fill="#FAF5E8" />
    <!-- Fine gold veins -->
    <path d="M0 -70 Q0 -30 0 0 M-85 30 Q-40 10 -5 0 M85 30 Q40 10 5 0" stroke="#DDA86C" stroke-width="0.7" opacity="0.45" fill="none" />
  </g>

  <!-- Cascade Bloom 2 (Central Full Open Bloom) -->
  <g id="bloom-mid" transform="translate(230, 360)">
    <!-- Dorsal Sepal -->
    <path d="M0 -105 C-38 -90 -45 -35 -26 0 C-8 22 18 22 26 0 C45 -35 38 -90 0 -105 Z" fill="url(#petalBlushDorsal)" opacity="0.94" />
    <!-- Lateral Sepals -->
    <path d="M-22 0 C-90 20 -110 70 -85 105 C-55 120 -15 90 0 28 Z" fill="url(#petalBlush)" opacity="0.92" />
    <path d="M22 0 C90 20 110 70 85 105 C55 120 15 90 0 28 Z" fill="url(#petalBlush)" opacity="0.92" />
    <!-- Large Rounded Lateral Petals -->
    <path d="M-12 -20 C-95 -60 -155 -15 -130 50 C-105 105 -35 60 -6 12 Z" fill="url(#petalBlush)" filter="url(#softGlow)" />
    <path d="M12 -20 C95 -60 155 -15 130 50 C105 105 35 60 6 12 Z" fill="url(#petalBlush)" filter="url(#softGlow)" />
    <!-- Petal Veins -->
    <g opacity="0.4" stroke="#CF8790" stroke-width="0.8" fill="none">
      <path d="M-120 45 C-80 30 -40 20 -10 5" />
      <path d="M-110 25 C-75 15 -40 10 -10 -2" />
      <path d="M-95 65 C-70 45 -40 30 -8 12" />
      <path d="M120 45 C80 30 40 20 10 5" />
      <path d="M110 25 C75 15 40 10 10 -2" />
      <path d="M95 65 C70 45 40 30 8 12" />
    </g>
    <!-- Intricate Lip / Labellum -->
    <!-- Side lobes -->
    <path d="M-28 15 C-42 22 -40 42 -25 45 C-18 45 -12 35 -14 22 Z" fill="#9E3342" />
    <path d="M28 15 C42 22 40 42 25 45 C18 45 12 35 14 22 Z" fill="#9E3342" />
    <!-- Mid-lobe spreading downward with delicate anchor tip -->
    <path d="M-22 30 C-32 60 -25 90 0 98 C25 90 32 60 22 30 C12 35 -12 35 -22 30 Z" fill="url(#lipGradient)" />
    <!-- Golden Callus / Throat Crest -->
    <ellipse cx="0" cy="38" rx="8" ry="6" fill="url(#lipCallus)" />
    <circle cx="-3" cy="38" r="1.2" fill="#701C25" />
    <circle cx="3" cy="38" r="1.2" fill="#701C25" />
    <circle cx="0" cy="42" r="1.4" fill="#701C25" />
    <!-- Column (anther cap) -->
    <path d="M-6 16 C-7 8 7 8 6 16 C5 22 -5 22 -6 16 Z" fill="#FFFDF8" stroke="#E2B765" stroke-width="0.8" />
    <!-- Delicate gold hairline touches -->
    <path d="M0 -98 C0 -50 0 0 0 20" stroke="#CCA468" stroke-width="0.7" opacity="0.35" fill="none" />
  </g>

  <!-- Cascade Bloom 3 (Lower Dramatic Angle) -->
  <g id="bloom-bottom" transform="translate(180, 560) scale(0.92) rotate(-8)">
    <!-- Sepals -->
    <path d="M-5 -100 C-40 -85 -48 -30 -28 5 C-10 25 16 25 24 5 C42 -30 35 -85 -5 -100 Z" fill="url(#petalBlushDorsal)" opacity="0.94" />
    <path d="M-20 0 C-85 22 -105 72 -80 106 C-50 120 -12 88 2 28 Z" fill="url(#petalBlush)" opacity="0.9" />
    <path d="M20 0 C85 22 105 72 80 106 C50 120 12 88 -2 28 Z" fill="url(#petalBlush)" opacity="0.9" />
    <!-- Broad Petals -->
    <path d="M-10 -18 C-92 -55 -150 -12 -125 52 C-100 104 -32 60 -5 12 Z" fill="url(#petalBlush)" />
    <path d="M10 -18 C92 -55 150 -12 125 52 C100 104 32 60 5 12 Z" fill="url(#petalBlush)" />
    <!-- Lip -->
    <path d="M-26 15 C-40 22 -38 42 -24 45 C-17 45 -11 35 -13 22 Z" fill="#9E3342" />
    <path d="M26 15 C40 22 38 42 24 45 C17 45 11 35 13 22 Z" fill="#9E3342" />
    <path d="M-20 30 C-30 60 -24 90 0 96 C24 90 30 60 20 30 Z" fill="url(#lipGradient)" />
    <ellipse cx="0" cy="37" rx="7.5" ry="5.5" fill="url(#lipCallus)" />
    <!-- Column -->
    <path d="M-6 16 C-7 8 7 8 6 16 C5 22 -5 22 -6 16 Z" fill="#FFFDF8" stroke="#E2B765" stroke-width="0.8" />
  </g>

  <!-- Ambient Golden Botanical Hairline Particles -->
  <g id="gold-accents" opacity="0.45" stroke="#C9A063" stroke-width="0.9" stroke-linecap="round">
    <path d="M290 85 Q305 75 320 80" fill="none" />
    <path d="M340 180 Q355 195 365 190" fill="none" />
    <path d="M265 310 Q285 325 295 315" fill="none" />
    <path d="M140 470 Q130 490 145 505" fill="none" />
  </g>
</svg>
